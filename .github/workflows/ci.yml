name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_ADMIN_URL: postgres://postgres@localhost:5432/postgres
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint (unused code, strict types)
        run: pnpm lint
      - name: Unit, financial, and database tests
        run: pnpm test
      - name: Underwriting coverage gate
        run: pnpm --filter @northstar/underwriting test:coverage
      - name: Build web
        run: pnpm --filter @northstar/web build
      - name: Prepare e2e database
        run: |
          psql -h localhost -U postgres -c 'create database northstar_e2e'
          DATABASE_OWNER_URL=postgres://postgres@localhost:5432/northstar_e2e APP_DB_ROLE=northstar_web APP_DB_PASSWORD=e2e-password pnpm db:migrate
      - name: Install Playwright Chromium
        run: pnpm --filter @northstar/web exec playwright install --with-deps chromium
      - name: E2E smoke test
        run: |
          cd apps/web
          DATABASE_URL=postgres://northstar_web:e2e-password@localhost:5432/northstar_e2e PORT=3000 pnpm start &
          for i in $(seq 1 30); do curl -sf localhost:3000/api/health && break; sleep 1; done
          BASE_URL=http://localhost:3000 SCREENSHOT_DIR=e2e-artifacts pnpm e2e
      - name: Upload e2e screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: apps/web/e2e-artifacts
          if-no-files-found: ignore
